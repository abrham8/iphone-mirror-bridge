# Options for iPhone Mirror Bridge. After editing, run:
#   sudo systemctl restart iphone-mirror-bridge
#
# Default (empty): built-in touchpad on laptops, otherwise the first mouse.
# Examples:
#   BRIDGE_ARGS="--mouse"                     use a mouse even on a laptop
#   BRIDGE_ARGS="--touchpad-speed 30"         faster touchpad pointer
#   BRIDGE_ARGS="--hotkey F12"                switch with Ctrl+F12
#   BRIDGE_ARGS="--reverse-scroll --no-tap"
# All options: iphone-mirror-bridge --help
BRIDGE_ARGS=""
