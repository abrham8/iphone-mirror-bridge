<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- iPhone Mirror Bridge control API. The service itself only accepts calls
     from root and from users with an active local login session. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.abrham8.IPhoneMirrorBridge"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.abrham8.IPhoneMirrorBridge"/>
  </policy>
</busconfig>
