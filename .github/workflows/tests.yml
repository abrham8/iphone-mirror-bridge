name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    # Uses the distribution Python so dbus-python, PyGObject and evdev come
    # from system packages, as they do on Debian.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dbus python3-dbus python3-gi gir1.2-glib-2.0 python3-evdev
      - name: Compile Python sources
        run: /usr/bin/python3 -m py_compile scripts/*.py tests/*.py
      - name: Run all tests (HID logic, D-Bus objects, end-to-end with fake BlueZ)
        shell: bash  # enables pipefail so a test failure is not hidden by tee
        run: |
          /usr/bin/python3 -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          if grep -q "skipped" test-output.txt; then
            echo "::error::Tests were skipped; system packages missing"; exit 1
          fi

  package:
    # Build the .deb and install it on a clean Debian 13, like an end user would.
    needs: unit
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates lintian
          scripts/build_deb.sh
          lintian --fail-on error,warning dist/*.deb
      - name: Install on clean Debian 13
        run: |
          apt-get install -y ./dist/iphone-mirror-bridge_*_all.deb
          iphone-mirror-bridge --version
          test -L /etc/systemd/system/multi-user.target.wants/iphone-mirror-bridge.service
          test -f /etc/iphone-mirror-bridge/bridge.conf
      - name: Run tests against the installed system packages
        run: |
          apt-get install -y --no-install-recommends dbus
          python3 -m unittest discover -s tests -v 2>&1 | tee test-output.txt
          ! grep -q "skipped" test-output.txt
      - name: Remove and purge
        run: |
          apt-get remove -y iphone-mirror-bridge
          apt-get purge -y iphone-mirror-bridge
          test ! -e /etc/iphone-mirror-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-mirror-bridge-deb
          path: dist/*.deb
